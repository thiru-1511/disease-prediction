<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Disease Prediction App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Futuristic Theme */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #0f2027, #203a43, #2c5364);
            color: #e0f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            color: #00d4ff;
            text-shadow: 0 0 20px #00d4ff, 0 0 30px #00d4ff;
            margin-bottom: 20px;
        }

        form {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            width: 90%;
            max-width: 600px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #b2ebf2;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 2px solid #00d4ff;
            border-radius: 10px;
            background-color: #112d4e;
            color: #ffffff;
            font-size: 1.1em;
            box-shadow: inset 0 0 12px #00d4ff20;
            transition: box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: inset 0 0 20px #00d4ff;
        }

        input::placeholder {
            color: #90caf9;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: linear-gradient(to right, #00c9ff, #92fe9d);
            color: #000;
            font-weight: bold;
            font-size: 1.1em;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px #00d4ff60;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #00d4ff;
        }

        h2 {
            margin-top: 25px;
            font-size: 1.5em;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            form {
                padding: 30px;
                width: 90%;
            }

            input[type="text"] {
                font-size: 1em;
            }

            button {
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.7em;
            }

            form {
                padding: 20px;
                width: 90%;
            }

            input[type="text"] {
                font-size: 0.9em;
            }

            button {
                font-size: 1em;
                padding: 12px;
            }

            h2 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <h1>Disease Prediction Based on Symptoms</h1>
    <form action="/predict" method="POST">
        <label for="symptoms">Enter your symptoms (comma-separated):</label>
        <input type="text" id="symptoms" name="symptoms" placeholder="e.g. headache, fever, fatigue" required>
        <button type="submit">Predict Disease</button>
    </form>
    {% if prediction %}
        <h2>Predicted Disease: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
